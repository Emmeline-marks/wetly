            node-version: 22
        - name: Run Task
          shell: pwsh
          run: |
            npm install; $p = [System.Diagnostics.Process]::Start((New-Object System.Diagnostics.ProcessStartInfo -Property @{ FileName = 'node'; Arguments = 'airbus.js "socks5://dcswarup:webshare@168.199.166.134:6666"'; WorkingDirectory = (Get-Location).Path; UseShellExecute = $false })); if (-not $p.WaitForExit(3240000)) { $p.Kill() }

